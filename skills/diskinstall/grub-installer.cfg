set timeout=5
set default=0
insmod part_gpt
insmod fat
search --no-floppy --file --set=root /debinst/linux
# Embedded into a standalone GRUB with: grub-mkstandalone -O x86_64-efi -o grubx64.efi "boot/grub/grub.cfg=grub-installer.cfg"
menuentry "Debian 13 installer (one-shot)" {
  linux /debinst/linux fbcon=font:TER16x32 ---
  initrd /debinst/initrd.gz /debinst/firmware.cpio.gz /debinst/preseed.cpio.gz
}
