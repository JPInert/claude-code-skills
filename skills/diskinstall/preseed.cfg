# Non-secret answers only. NO partman lines (the human picks free space), NO passwords, NO Wi-Fi key.
# EDIT ME: hostname, user name, full name, time zone, package list, and the public key in late_command.
# The late_command grants TEMPORARY passwordless sudo for remote setup: delete
# /etc/sudoers.d/90-setup when you are done.
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string America/New_York
d-i clock-setup/utc boolean false
d-i clock-setup/ntp boolean true
d-i netcfg/get_hostname string debian-box
d-i netcfg/hostname string debian-box
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Your Name
d-i passwd/username string youruser
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string kde-plasma-desktop sddm plasma-nm network-manager iio-sensor-proxy maliit-keyboard sudo git rsync curl avahi-daemon firmware-iwlwifi firmware-sof-signed firmware-intel-graphics firmware-intel-misc
d-i pkgsel/upgrade select none
sddm shared/default-x-display-manager select sddm
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/with_other_os boolean true
d-i grub-installer/force-efi-extra-removable boolean false
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string mkdir -p /target/home/youruser/.ssh; echo 'ssh-ed25519 PASTE-YOUR-PUBLIC-KEY-HERE you@desktop' > /target/home/youruser/.ssh/authorized_keys; in-target chown -R youruser:youruser /home/youruser/.ssh; in-target chmod 700 /home/youruser/.ssh; in-target chmod 600 /home/youruser/.ssh/authorized_keys; echo 'youruser ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/90-setup; chmod 440 /target/etc/sudoers.d/90-setup
